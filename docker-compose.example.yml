services:
  retrospend:
    image: synzeit/retrospend:latest
    container_name: retrospend
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}"
      # Optional: a secret of your own for the retrospend_owner role. Same value on the app and the sidecar, or empty on both.
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:-}
      SHOW_LANDING_PAGE: "true"
      WORKER_API_KEY: ${WORKER_API_KEY}
      DEFAULT_TIME_ZONE: ${DEFAULT_TIME_ZONE:-}
      SIDECAR_URL: "http://sidecar:8080"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATA_MASTER_KEY: ${DATA_MASTER_KEY:-}
      DATA_MASTER_KEY_FILE: ${DATA_MASTER_KEY_FILE:-}
      # Optional: "false" stops the 15-minute auto-post of recurring expenses.
      RECURRING_AUTO_POST: ${RECURRING_AUTO_POST:-}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
      # Optional: restrict accepted origins (e.g. if behind a tunnel with a different hostname)
      # TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # SMTP settings (required for email notifications and password reset)
      # SMTP_HOST: ${SMTP_HOST:-}
      # SMTP_PORT: ${SMTP_PORT:-587}
      # SMTP_USER: ${SMTP_USER:-}
      # SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # EMAIL_FROM: ${EMAIL_FROM:-}
      # UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      # Push notifications (see .env.example): each sender needs all of its settings
      # VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # PUSH_ENDPOINT_ALLOW_HOSTS: ${PUSH_ENDPOINT_ALLOW_HOSTS:-}
      # APNS_KEY_ID: ${APNS_KEY_ID:-}
      # APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      # APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      # APNS_KEY: ${APNS_KEY:-}
      # FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
    ports:
      - "1997:1997"
    volumes:
      - uploads:/data/uploads
      - exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: retrospend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    # Not published: only the other services reach the database. To use psql or
    # another tool from this machine, publish it on the loopback address only
    # (never "5432:5432", which listens on every interface):
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  sidecar:
    image: synzeit/retrospend-sidecar:latest
    container_name: retrospend-sidecar
    restart: unless-stopped
    # Not published: the app reaches it at http://sidecar:8080. If you need it
    # from this machine, bind the loopback address only: "127.0.0.1:8080:8080".
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}"
      # Optional: a secret of your own for the retrospend_owner role. Same value on the app and the sidecar, or empty on both.
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:-}
      WORKER_API_KEY: ${WORKER_API_KEY}
      DEFAULT_TIME_ZONE: ${DEFAULT_TIME_ZONE:-}
      LOG_LEVEL: "info"
      BACKUP_DIR: "/backups"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_CRON: "${BACKUP_CRON:-0 3 * * *}"
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:-}"
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://ollama:11434/api/generate}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      ENRICH_BATCH_SIZE: "${ENRICH_BATCH_SIZE:-20}"
      ENRICH_CONCURRENCY: "${ENRICH_CONCURRENCY:-3}"
      PDF_CONCURRENCY: "${PDF_CONCURRENCY:-3}"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen-2.5-7b-instruct}
    volumes:
      - backup_data:/backups
      - sidecar_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 1.1.1.1
      - 1.0.0.1
    devices:
      - nvidia.com/gpu=all

volumes:
  postgres_data:
  ollama_data:
  sidecar_data:
  backup_data:
  uploads:
  exports:
