# The root is the web app (package "retrospend"); shared code lives in
# packages/ and the native app in apps/.
packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma

# Skip versions published in the last 7 days (supply-chain safety).
minimumReleaseAge: 10080

# TEMPORARY (owner OK 2026-10-22): these exact versions were already in the
# lockfile and running in prod while younger than minimumReleaseAge, which
# makes pnpm refuse any lockfile change. Remove this list on 2026-10-29, when
# every version here is older than 7 days.
