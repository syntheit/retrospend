name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Tests mock the database; these only satisfy env validation and prisma.config.ts.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@v4
        with:
          # The UI ratchet compares its baseline with the merge base on main.
          fetch-depth: 0

      # Version comes from packageManager in package.json (pnpm@10.25.0)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Also runs the UI ratchet (src/test/uiRules) and the i18n catalog
      # check (src/i18n/catalog-validation.test.ts), which are vitest files.
      - name: Test
        run: pnpm test

  pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each run creates and drops its own database next to this one.
      TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/retrospend_test
      # Only satisfies prisma.config.ts for generate; the tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/retrospend_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Postgres tests
        run: pnpm test:pg

  build:
    runs-on: ubuntu-latest
    env:
      # The build reads no data; these only satisfy env validation.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # The Expo app (apps/mobile). Biome covers it through `pnpm lint` in check.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The app and the workspace packages it uses, not the web app.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@retrospend/mobile..."

      - name: Typecheck
        run: pnpm --filter @retrospend/mobile typecheck

      # Includes the golden money vectors and the Google-free npm guard.
      - name: Test
        run: pnpm --filter @retrospend/mobile test

  # The Gradle half of the Google-free guard: resolves the Android dependency
  # tree of a fresh prebuild and fails on Play services or Firebase groups.
  # Dependency resolution only, no native compile.
  android-google-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install
        run: pnpm install --frozen-lockfile --filter "@retrospend/mobile..."

      - name: Prebuild
        run: pnpm --filter @retrospend/mobile exec expo prebuild --platform android --clean --no-install

      - name: Google-free dependency tree
        run: bash apps/mobile/scripts/check-google-free.sh

  sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      # The PDF importer shells out to pdftotext (the image installs it too).
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test
        run: go test ./...

  # The Playwright suite on a seeded database (e2e/fixtures/seed.ts). Only on
  # pull requests and the integration branches: a dev server and Chrome cost
  # several runner minutes. The helpers' unit tests run in the check job.
  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/segment/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test_e2e
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite's own default (e2e/constants.ts); prisma.config.ts needs it too.
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E suite
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
