name: CI

# Pushes only to the branches that integrate: a pull request from a branch in
# this repo would otherwise run everything twice (push and pull_request).
on:
  push:
    branches: [main, "segment/**"]
  pull_request:
  workflow_dispatch:

# A newer push to a branch cancels its older run, but every main commit is
# tested to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No job writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests mock the database; these only satisfy env validation and prisma.config.ts.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The UI ratchet compares its baseline with the merge base on main.
          fetch-depth: 0

      # Version comes from packageManager in package.json (pnpm@10.25.0)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Also runs the UI ratchet (src/test/uiRules) and the i18n catalog
      # check (src/i18n/catalog-validation.test.ts), which are vitest files.
      - name: Test
        run: pnpm test

  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each run creates and drops its own database next to this one.
      TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/retrospend_test
      # Only satisfies prisma.config.ts for generate; the tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/retrospend_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Postgres tests
        run: pnpm test:pg

  # The same suite with user text sealed on write, failing a file that leaves
  # plaintext in a mapped column (src/test/sealed-sweep.ts).
  pg-sealed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/retrospend_test
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/retrospend_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Sealed Postgres tests
        run: pnpm test:pg:sealed

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build reads no data; these only satisfy env validation.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Next's incremental build cache: unchanged modules are not recompiled.
      # Every run restores the newest one; only main saves, so pull requests
      # don't churn the repo's 10 GB cache quota.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # The production images build (nothing is pushed), so a broken Dockerfile
  # shows up here and not at release time.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
          - name: sidecar
            context: sidecar
            file: sidecar/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The Expo app (apps/mobile). Biome covers it through `pnpm lint` in check.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The app and the workspace packages it uses, not the web app.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@retrospend/mobile..."

      - name: Typecheck
        run: pnpm --filter @retrospend/mobile typecheck

      # Includes the golden money vectors and the Google-free npm guard.
      - name: Test
        run: pnpm --filter @retrospend/mobile test

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tasks' *_db_test.go run the real jobs (autopay writes money) against
    # a migrated database; without SIDECAR_TEST_DATABASE_URL they skip.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test_sidecar
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIDECAR_TEST_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_sidecar
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Prisma owns the schema; the sidecar has no migrations of its own.
      - name: Migrate the test database
        working-directory: .
        env:
          DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_sidecar
        run: pnpm install --frozen-lockfile && pnpm exec prisma migrate deploy

      # The PDF importer shells out to pdftotext (the image installs it too).
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test
        run: go test ./...

      # A skip would pass silently, so check the database tests ran.
      - name: Database tests ran
        run: |
          go test ./tasks/ -run 'TestProcessRecurring|TestRecordRateHistory' -v -count=1 | tee db-tests.log
          if grep -q -- '--- SKIP' db-tests.log; then exit 1; fi
          for t in TestProcessRecurringPostsMoneyIn TestProcessRecurringStepsInUserZone TestRecordRateHistory; do
            grep -q -- "--- PASS: $t" db-tests.log
          done

  # The Playwright suite on a seeded database (e2e/fixtures/seed.ts). The
  # helpers' unit tests run in the check job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One worker per job (the specs share one seeded ledger), so the suite is
    # split by file across jobs instead; each has its own Postgres. Serial, it
    # outgrew the 20-minute cap (about 18 to 19 minutes by 2026-11).
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test_e2e
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite's own default (e2e/constants.ts); prisma.config.ts needs it too.
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      # The browser download is cached per Playwright version; the system
      # libraries still come from apt.
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E suite
        run: pnpm exec playwright test --shard=${{ matrix.shard }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  # The same suite with DATA_KEYS_WRITE on and a throwaway master key
  # (E2E_SEALED=1, e2e/constants.ts): user text is sealed on write, every
  # /api response is checked for ciphertext, and e2e/flows/zz-sealing.spec.ts
  # checks the database. Pushes to main and segment/** only: the workflow
  # triggers on no other branch, and the condition keeps pull requests and
  # manual runs on other branches out.
  e2e-sealed:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One worker per job (the specs share one seeded ledger), so the suite is
    # split by file across jobs instead; each has its own Postgres. Serial, it
    # outgrew the 20-minute cap (about 18 to 19 minutes by 2026-11).
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test_e2e
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite's own default (e2e/constants.ts); prisma.config.ts needs it too.
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
      E2E_SEALED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      # The browser download is cached per Playwright version; the system
      # libraries still come from apt.
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Sealed E2E suite
        run: pnpm exec playwright test --shard=${{ matrix.shard }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-sealed-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  # Visual regression (e2e/visual): the gallery and the shell against the
  # committed baselines. The browser runs in the pinned Playwright image,
  # the same renderer that drew the baselines (e2e/visual/run.sh).
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test_e2e
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Visual regression
        run: bash e2e/visual/run.sh --workers=2

      # Holds the expected, actual and diff images of every mismatch.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
