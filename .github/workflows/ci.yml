name: CI

# Pushes only to the branches that integrate: a pull request from a branch in
# this repo would otherwise run everything twice (push and pull_request).
on:
  push:
    branches: [main, "segment/**"]
  pull_request:
  workflow_dispatch:

# A newer push to a branch cancels its older run, but every main commit is
# tested to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No job writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests mock the database; these only satisfy env validation and prisma.config.ts.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The UI ratchet compares its baseline with the merge base on main.
          fetch-depth: 0

      # Version comes from packageManager in package.json (pnpm@10.25.0)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Also runs the UI ratchet (src/test/uiRules) and the i18n catalog
      # check (src/i18n/catalog-validation.test.ts), which are vitest files.
      - name: Test
        run: pnpm test

  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each run creates and drops its own database next to this one.
      TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/retrospend_test
      # Only satisfies prisma.config.ts for generate; the tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/retrospend_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Postgres tests
        run: pnpm test:pg

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build reads no data; these only satisfy env validation.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Next's incremental build cache: unchanged modules are not recompiled.
      # Every run restores the newest one; only main saves, so pull requests
      # don't churn the repo's 10 GB cache quota.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.ref == 'refs/heads/main'
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # The production images build (nothing is pushed), so a broken Dockerfile
  # shows up here and not at release time.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
          - name: sidecar
            context: sidecar
            file: sidecar/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The Expo app (apps/mobile). Biome covers it through `pnpm lint` in check.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # The app and the workspace packages it uses, not the web app.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@retrospend/mobile..."

      - name: Typecheck
        run: pnpm --filter @retrospend/mobile typecheck

      # Includes the golden money vectors and the Google-free npm guard.
      - name: Test
        run: pnpm --filter @retrospend/mobile test

  # The Gradle half of the Google-free guard: resolves the Android dependency
  # tree of a fresh prebuild and fails on Play services or Firebase groups.
  # Dependency resolution only, no native compile.
  android-google-free:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install
        run: pnpm install --frozen-lockfile --filter "@retrospend/mobile..."

      - name: Prebuild
        run: pnpm --filter @retrospend/mobile exec expo prebuild --platform android --clean --no-install

      - name: Google-free dependency tree
        run: bash apps/mobile/scripts/check-google-free.sh

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      # The PDF importer shells out to pdftotext (the image installs it too).
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test
        run: go test ./...

  # The Playwright suite on a seeded database (e2e/fixtures/seed.ts). The
  # helpers' unit tests run in the check job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One worker per job (the specs share one seeded ledger), so the suite is
    # split by file across jobs instead; each has its own Postgres. Serial, it
    # outgrew the 20-minute cap (about 18 to 19 minutes by 2026-11).
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test_e2e
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite's own default (e2e/constants.ts); prisma.config.ts needs it too.
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      # The browser download is cached per Playwright version; the system
      # libraries still come from apt.
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E suite
        run: pnpm exec playwright test --shard=${{ matrix.shard }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  # Visual regression (e2e/visual): the gallery and the shell against the
  # committed baselines. The browser runs in the pinned Playwright image,
  # the same renderer that drew the baselines (e2e/visual/run.sh).
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retrospend_test_e2e
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
      E2E_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5436/retrospend_test_e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Visual regression
        run: bash e2e/visual/run.sh --workers=2

      # Holds the expected, actual and diff images of every mismatch.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
