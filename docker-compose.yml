services:
  retrospend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     PUBLIC_URL: ${PUBLIC_URL:-http://localhost:1997}
    #     SHOW_LANDING_PAGE: ${SHOW_LANDING_PAGE:-false}
    #     ENABLE_LEGAL_PAGES: ${ENABLE_LEGAL_PAGES:-false}
    image: synzeit/retrospend:latest
    pull_policy: never
    container_name: retrospend
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}"
      # Optional: a secret of your own for the retrospend_owner role. Same value on the app and the sidecar, or empty on both.
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:-}
      WORKER_API_KEY: ${WORKER_API_KEY}
      DEFAULT_TIME_ZONE: ${DEFAULT_TIME_ZONE:-}
      SIDECAR_URL: "http://sidecar:8080"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DATA_MASTER_KEY: ${DATA_MASTER_KEY:-}
      DATA_MASTER_KEY_FILE: ${DATA_MASTER_KEY_FILE:-}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
      SHOW_LANDING_PAGE: "true"
      ENABLE_LEGAL_PAGES: "true"
    ports:
      - "1997:1997"
    volumes:
      - uploads:/data/uploads
      - exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: retrospend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    # Local only. Publishing this on all interfaces puts the superuser login
    # on the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: retrospend-sidecar
    restart: unless-stopped
    # Local only: the sidecar's API is guarded by WORKER_API_KEY alone.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}"
      # Optional: a secret of your own for the retrospend_owner role. Same value on the app and the sidecar, or empty on both.
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:-}
      WORKER_API_KEY: ${WORKER_API_KEY}
      DEFAULT_TIME_ZONE: ${DEFAULT_TIME_ZONE:-}
      LOG_LEVEL: "info"
      BACKUP_DIR: "/backups"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_CRON: "${BACKUP_CRON:-0 3 * * *}"
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:-}"
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://ollama:11434/api/generate}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      ENRICH_BATCH_SIZE: "${ENRICH_BATCH_SIZE:-20}"
      ENRICH_CONCURRENCY: "${ENRICH_CONCURRENCY:-3}"
      PDF_CONCURRENCY: "${PDF_CONCURRENCY:-3}"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen-2.5-7b-instruct}
    volumes:
      - backup_data:/backups
      - sidecar_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 1.1.1.1
      - 1.0.0.1
    devices:
      - nvidia.com/gpu=all

  # A console that signs in to the database as the superuser. Off unless asked
  # for: docker compose --profile tools up -d pgweb
  pgweb:
    image: sosedoff/pgweb
    container_name: retrospend-pgweb
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8081"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_NAME}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  sidecar_data:
  backup_data:
  uploads:
  exports:
